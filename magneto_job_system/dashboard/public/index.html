<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magneto Job Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: '#0f172a',
            panel: '#111827',
            accent: '#22c55e'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-7xl mx-auto px-4 py-6">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <p class="text-emerald-400 text-sm font-semibold">Autonomous Job System</p>
        <h1 class="text-3xl font-bold tracking-tight">Magneto365 Dashboard</h1>
      </div>
      <div class="flex gap-3">
        <input id="search" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 w-72 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Buscar cargo, empresa, ciudad">
        <button id="refresh" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg px-4 py-2 transition">Actualizar</button>
      </div>
    </header>

    <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-slate-400 text-sm">Vacantes</p>
        <strong id="stat-total" class="text-3xl">0</strong>
      </article>
      <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-slate-400 text-sm">Aplicadas</p>
        <strong id="stat-applied" class="text-3xl">0</strong>
      </article>
      <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-slate-400 text-sm">Compatibilidad Prom.</p>
        <strong id="stat-score" class="text-3xl">0%</strong>
      </article>
      <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-slate-400 text-sm">Alta Prioridad</p>
        <strong id="stat-priority" class="text-3xl">0</strong>
      </article>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
          <h2 class="font-semibold">Vacantes encontradas</h2>
          <span id="bot-status" class="text-xs bg-emerald-500/10 text-emerald-300 px-2 py-1 rounded-full">online</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-950 text-slate-400">
              <tr>
                <th class="text-left p-3">Cargo</th>
                <th class="text-left p-3">Empresa</th>
                <th class="text-left p-3">Salario</th>
                <th class="text-left p-3">Score</th>
                <th class="text-left p-3">Estado</th>
              </tr>
            </thead>
            <tbody id="jobs"></tbody>
          </table>
        </div>
      </div>

      <aside class="space-y-4">
        <section class="bg-slate-900 border border-slate-800 rounded-xl">
          <div class="p-4 border-b border-slate-800">
            <h2 class="font-semibold">Ultimas busquedas</h2>
          </div>
          <div id="searches" class="p-4 space-y-3"></div>
        </section>

        <section class="bg-slate-900 border border-slate-800 rounded-xl">
          <div class="p-4 border-b border-slate-800">
            <h2 class="font-semibold">Logs en tiempo real</h2>
          </div>
          <div id="logs" class="p-4 h-96 overflow-auto space-y-2 text-xs font-mono"></div>
        </section>
      </aside>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
